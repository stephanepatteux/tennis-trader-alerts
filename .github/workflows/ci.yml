name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only need to read the repo contents.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tennis-trader-alerts .

      - name: Smoke test (no keys → clean ConfigError exit)
        run: |
          set +e
          docker run --rm --name tta tennis-trader-alerts
          code=$?
          set -e
          if [ "$code" != "2" ]; then
            echo "expected exit 2 (missing Ultra key), got $code"
            exit 1
          fi
